<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Brigade · dev non disponibile</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#1e293b;font:16px/1.5 -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  main{max-width:420px;padding:24px;text-align:center}
  a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:12px;background:#1e293b;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <h1 style="font-size:20px">Ambiente di sviluppo non disponibile</h1>
  <p>Questa copia vecchia di Brigade è stata ritirata: il suo editor ricette poteva perdere dati.</p>
  <a href="../">Apri Brigade</a>
</main>
<script>
// BR-FIX02: nessun codice dell'app qui. Si toglie il vecchio service worker di /dev/ e la sua cache.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (/\/dev\/$/.test(r.scope)) r.unregister(); }));
if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith('boh-dev')).forEach(k => caches.delete(k)));
</script>
</body>
</html>
