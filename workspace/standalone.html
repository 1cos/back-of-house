<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BOH OS — Workspace</title>
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root{
  --bg-base:#eff6ff; --bg-mid:#dbeafe; --bg-accent:#e0f2fe;
  --surface:#ffffff; --surface-glass:rgba(255,255,255,.72);
  --surface-raised:rgba(255,255,255,.94);
  --text-primary:#1e3a5f; --text-secondary:#3b6ea8;
  --text-muted:#7a9cc4; --text-inverse:#ffffff;
  --text-tab:#4a6fa5; --text-tab-active:#1e3a5f;
  --blue-900:#1e3a5f; --blue-700:#1d4ed8; --blue-600:#2563eb;
  --blue-500:#3b82f6; --blue-400:#60a5fa;
  --blue-200:#bfdbfe; --blue-100:#dbeafe; --blue-50:#eff6ff;
  --ok:#16a34a; --ok-bg:#f0fdf4; --ok-border:#bbf7d0;
  --warn:#d97706; --warn-bg:#fffbeb; --warn-border:#fde68a;
  --danger:#dc2626; --danger-bg:#fef2f2; --danger-border:#fecaca;
  --info:#2563eb; --info-bg:#eff6ff; --info-border:#bfdbfe;
  --border:rgba(37,99,235,.12); --border-tab:rgba(37,99,235,.16);
  --border-strong:rgba(37,99,235,.26);
  --shadow-xs:0 1px 3px rgba(30,58,95,.07);
  --shadow-sm:0 2px 6px rgba(30,58,95,.09);
  --shadow-md:0 6px 20px rgba(30,58,95,.12);
  --shadow-lg:0 12px 40px rgba(30,58,95,.16);
  --shadow-glass:0 4px 24px rgba(30,58,95,.08),inset 0 1px 0 rgba(255,255,255,.7);
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px; --r-pill:999px;
  --font-sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
  --font-mono:'SF Mono','Fira Code',monospace;
  --topbar-h:56px; --tabbar-h:44px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-sans);font-size:15px;
  color:var(--text-primary);background:var(--bg-base);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,select,textarea{font-family:inherit}

/* ── App shell ────────────────────────────────────────────────────────────── */
#ws-app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background:linear-gradient(150deg,var(--bg-base) 0%,var(--bg-mid) 60%,var(--bg-accent) 100%)}

/* ── TOP BAR ─────────────────────────────────────────────────────────────── */
#ws-topbar{
  flex-shrink:0;height:var(--topbar-h);
  display:flex;align-items:center;gap:12px;padding:0 20px;
  background:var(--surface-glass);
  backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-sm);z-index:100
}
.topbar-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;min-width:160px}
.brand-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--blue-600),var(--blue-400));
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#fff;
  box-shadow:0 2px 8px rgba(37,99,235,.35);flex-shrink:0
}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-name{font-size:15px;font-weight:700;color:var(--blue-700);letter-spacing:-.03em}
.brand-sub{font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}

.topbar-search{
  flex:1;max-width:360px;
  display:flex;align-items:center;gap:8px;
  background:var(--surface-raised);border:1px solid var(--border);
  border-radius:var(--r-pill);padding:7px 14px;
  color:var(--text-muted);font-size:13px;cursor:text;
  transition:border-color .15s,box-shadow .15s
}
.topbar-search:hover{border-color:var(--border-strong);box-shadow:var(--shadow-xs)}
.search-icon{font-size:14px;opacity:.7}

.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}

/* Role pill */
.role-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--blue-50);border:1px solid var(--blue-200);
  border-radius:var(--r-pill);padding:5px 12px 5px 8px;
  cursor:pointer;transition:all .12s
}
.role-pill:hover{background:var(--blue-100);border-color:var(--blue-400)}
.role-avatar{
  width:22px;height:22px;border-radius:50%;
  background:var(--blue-600);color:#fff;
  font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.role-name{font-size:12px;font-weight:600;color:var(--blue-700)}
.role-select-hidden{
  position:absolute;opacity:0;width:100%;height:100%;
  top:0;left:0;cursor:pointer
}
.role-wrapper{position:relative}

/* Lang switcher */
.lang-switcher{display:flex;gap:2px;background:var(--blue-50);
  border:1px solid var(--blue-200);border-radius:var(--r-pill);padding:3px}
.lang-btn{
  font-size:11px;font-weight:700;padding:4px 8px;
  border-radius:var(--r-pill);color:var(--text-muted);
  letter-spacing:.04em;transition:all .12s
}
.lang-btn:hover{background:var(--blue-100);color:var(--blue-600)}
.lang-btn.active{background:var(--blue-600);color:#fff;box-shadow:0 1px 4px rgba(37,99,235,.3)}

/* Demo badge */
.demo-badge{
  font-size:9px;font-weight:700;letter-spacing:.1em;
  color:var(--warn);background:var(--warn-bg);
  border:1px solid var(--warn-border);border-radius:var(--r-pill);
  padding:3px 8px;flex-shrink:0
}

/* ── TAB BAR ─────────────────────────────────────────────────────────────── */
#ws-tabbar{
  flex-shrink:0;height:var(--tabbar-h);
  background:rgba(239,246,255,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  overflow:hidden;position:relative
}
.tabbar-inner{
  display:flex;align-items:stretch;height:100%;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
  padding:0 6px;gap:2px
}
.tabbar-inner::-webkit-scrollbar{display:none}

/* single tab */
.ws-tab{
  display:flex;align-items:center;gap:5px;
  padding:0 12px 0 10px;min-width:100px;max-width:200px;
  height:100%;flex-shrink:0;
  background:transparent;color:var(--text-tab);
  font-size:13px;cursor:pointer;user-select:none;
  border-bottom:2px solid transparent;
  border-radius:var(--r-sm) var(--r-sm) 0 0;
  transition:background .12s,color .12s,border-color .12s;
  position:relative
}
.ws-tab:hover{background:rgba(255,255,255,.55);color:var(--text-primary)}
.ws-tab.active{
  background:var(--surface);color:var(--text-tab-active);
  font-weight:600;border-bottom-color:var(--blue-600);
  box-shadow:0 -1px 0 0 rgba(37,99,235,.15) inset,
             0 2px 8px rgba(30,58,95,.06)
}
.tab-icon{font-size:14px;flex-shrink:0}
.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tab-close{
  flex-shrink:0;width:18px;height:18px;
  border-radius:50%;font-size:10px;
  color:var(--text-muted);opacity:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .12s
}
.ws-tab:hover .tab-close{opacity:1}
.ws-tab.active .tab-close{opacity:.6}
.tab-close:hover{opacity:1!important;background:var(--danger-bg);color:var(--danger)}
.tab-new{
  flex-shrink:0;width:38px;height:100%;
  font-size:20px;color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-sm);margin:auto 2px;
  transition:all .12s
}
.tab-new:hover{color:var(--blue-600);background:rgba(255,255,255,.6)}

/* fade edge on right */
#ws-tabbar::after{
  content:'';position:absolute;right:46px;top:0;bottom:0;
  width:32px;background:linear-gradient(to right,transparent,rgba(239,246,255,.9));
  pointer-events:none
}

/* ── WORKSPACE ────────────────────────────────────────────────────────────── */
#ws-workspace{
  flex:1;overflow-y:auto;
  padding:32px 28px 48px;
  scroll-behavior:smooth;position:relative
}
@media(max-width:640px){#ws-workspace{padding:18px 14px 36px}}

/* ── Shared page layout ───────────────────────────────────────────────────── */
.page-inner{width:100%;max-width:1100px;margin:0 auto}

.page-header{margin-bottom:28px}
.page-header-row{display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:4px}
.page-title{font-size:26px;font-weight:700;color:var(--text-primary);
  letter-spacing:-.025em;line-height:1.15}
.page-subtitle{font-size:13px;color:var(--text-secondary);margin-top:5px}

.section{
  background:var(--surface-glass);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-glass)
}
.section-title{
  font-size:11px;font-weight:700;color:var(--text-muted);
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:16px
}

.demo-note{
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:var(--text-muted);
  padding:8px 0 0;margin-top:4px
}
.demo-dot{width:5px;height:5px;border-radius:50%;background:var(--warn);flex-shrink:0}

/* ── Badges ───────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap}
.badge-ok    {background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.badge-warn  {background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.badge-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}
.badge-info  {background:var(--info-bg);color:var(--info);border:1px solid var(--info-border)}

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn-primary{
  background:var(--blue-600);color:#fff;
  font-size:13px;font-weight:600;padding:9px 18px;
  border-radius:var(--r-md);transition:all .12s;white-space:nowrap
}
.btn-primary:hover{background:var(--blue-700);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-primary:active{transform:none;box-shadow:none}
.btn-secondary{
  background:var(--surface-raised);color:var(--text-secondary);
  font-size:13px;font-weight:500;padding:9px 16px;
  border-radius:var(--r-md);border:1px solid var(--border);transition:all .12s
}
.btn-secondary:hover{background:var(--blue-100);color:var(--blue-600)}

/* ════════════════════════════════════════════════════════════════════════════
   HOME PAGE
   ════════════════════════════════════════════════════════════════════════════ */
.home-greeting{margin-bottom:36px}
.greeting-eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-muted);margin-bottom:8px
}
.greeting-text{
  font-size:32px;font-weight:700;color:var(--blue-900);
  letter-spacing:-.035em;line-height:1.15
}
.greeting-sub{font-size:15px;color:var(--text-secondary);margin-top:6px}

/* Desktop: 3-col, tablet: 2-col, mobile: 1-col */
.home-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;margin-bottom:28px
}
@media(max-width:900px){.home-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.home-grid{grid-template-columns:1fr}}

.home-card{
  display:flex;flex-direction:column;gap:0;
  background:var(--surface-glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:var(--r-xl);
  padding:0;text-align:left;cursor:pointer;
  box-shadow:var(--shadow-glass);
  transition:all .22s cubic-bezier(.34,1.25,.64,1);
  overflow:hidden
}
.home-card:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 48px rgba(30,58,95,.14);
  border-color:var(--blue-400)
}
.home-card:active{transform:translateY(0);box-shadow:var(--shadow-sm)}

.home-card-top{
  padding:22px 22px 16px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px
}
.home-card-icon{
  font-size:28px;width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  background:var(--blue-50);border:1px solid var(--blue-100);
  border-radius:var(--r-lg);flex-shrink:0
}
.home-card-arrow{font-size:18px;color:var(--text-muted);transition:transform .15s,color .15s}
.home-card:hover .home-card-arrow{transform:translate(2px,-2px);color:var(--blue-500)}

.home-card-body{padding:0 22px 22px}
.home-card-title{font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:5px}
.home-card-desc{font-size:12px;color:var(--text-muted);line-height:1.55}

/* Pinned status strip at bottom of card */
.home-card-status{
  border-top:1px solid var(--border);
  padding:9px 22px;
  font-size:11px;font-weight:500;color:var(--text-muted);
  display:flex;align-items:center;gap:6px;
  background:rgba(239,246,255,.4)
}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-ok{background:var(--ok)}
.status-warn{background:var(--warn)}
.status-info{background:var(--info)}

/* ════════════════════════════════════════════════════════════════════════════
   BOT CENTER
   ════════════════════════════════════════════════════════════════════════════ */
.pipeline-list{display:flex;flex-direction:column;gap:8px}
.pipeline-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  background:var(--surface-raised);border:1px solid var(--border);
  border-radius:var(--r-md)
}
.pipeline-step{
  width:26px;height:26px;border-radius:50%;
  background:var(--blue-100);color:var(--blue-700);
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.pipeline-body{flex:1;min-width:0}
.pipeline-name{display:block;font-size:13px;font-weight:500;
  color:var(--text-primary);font-family:var(--font-mono);margin-bottom:1px}
.pipeline-meta{font-size:11px;color:var(--text-muted)}

.obs-list{display:flex;flex-direction:column;gap:8px}
.obs-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 14px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--surface-raised);
  font-size:13px;line-height:1.5
}
.obs-warn{border-color:var(--warn-border);background:var(--warn-bg)}
.obs-info{border-color:var(--info-border);background:var(--info-bg)}

/* ════════════════════════════════════════════════════════════════════════════
   RECIPE
   ════════════════════════════════════════════════════════════════════════════ */
.recipe-layout{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}
@media(max-width:720px){.recipe-layout{grid-template-columns:1fr}}

.bom-row{
  display:grid;grid-template-columns:1fr auto;gap:16px;
  padding:9px 2px;border-bottom:1px solid var(--border);align-items:center
}
.bom-row:last-child{border-bottom:none}
.bom-item{font-size:13px;color:var(--text-primary)}
.bom-qty{font-size:12px;font-weight:600;font-family:var(--font-mono);
  color:var(--blue-600);white-space:nowrap}
.bom-header{
  display:grid;grid-template-columns:1fr auto;gap:16px;
  padding:0 2px 8px;border-bottom:1px solid var(--border);margin-bottom:2px;
  font-size:10px;font-weight:700;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.06em
}

.steps-list{display:flex;flex-direction:column;gap:12px}
.step-item{display:flex;align-items:flex-start;gap:12px;font-size:13px;line-height:1.55}
.step-num{
  width:24px;height:24px;border-radius:50%;
  background:var(--blue-600);color:#fff;
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px
}

/* ════════════════════════════════════════════════════════════════════════════
   INVENTORY
   ════════════════════════════════════════════════════════════════════════════ */
.inv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:560px){.inv-stats{grid-template-columns:1fr 1fr}}
.inv-stat{
  background:var(--surface-glass);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px 18px;box-shadow:var(--shadow-glass)
}
.inv-stat-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px;display:block}
.inv-stat-value{font-size:20px;font-weight:700;color:var(--text-primary)}
.val-ok{color:var(--ok)}.val-bad{color:var(--danger);font-size:13px!important}

.movements-list{display:flex;flex-direction:column;gap:6px}
.movement-row{
  display:grid;grid-template-columns:90px 62px 1fr;
  align-items:center;gap:12px;
  padding:10px 14px;background:var(--surface-raised);
  border:1px solid var(--border);border-radius:var(--r-md);font-size:13px
}
@media(max-width:480px){.movement-row{grid-template-columns:70px 55px 1fr;gap:8px}}
.m-date{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
.m-qty{font-weight:700;font-family:var(--font-mono)}
.qty-pos{color:var(--ok)}.qty-neg{color:var(--danger)}
.m-meta{display:flex;flex-direction:column;gap:1px;min-width:0}
.m-source{font-weight:500;font-size:13px;color:var(--text-primary)}
.m-note{font-size:11px;color:var(--text-muted)}

/* ════════════════════════════════════════════════════════════════════════════
   JOURNAL
   ════════════════════════════════════════════════════════════════════════════ */
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{
  font-size:12px;font-weight:500;padding:5px 13px;
  border-radius:var(--r-pill);border:1px solid var(--border);
  color:var(--text-secondary);background:var(--surface-raised);
  cursor:pointer;transition:all .12s
}
.chip:hover{border-color:var(--blue-400);color:var(--blue-600)}
.chip.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}

.j-entries{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.j-entry{
  background:var(--surface-glass);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px 20px;transition:box-shadow .12s
}
.j-entry:hover{box-shadow:var(--shadow-md)}
.j-entry.sev-ok  {border-left:3px solid var(--ok)}
.j-entry.sev-warn{border-left:3px solid var(--warn)}
.j-meta{display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.j-cat{font-size:10px;font-weight:700;color:var(--text-secondary);letter-spacing:.06em}
.j-dot{font-size:9px;color:var(--text-muted)}
.j-time{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
.j-author{font-size:11px;color:var(--text-muted)}
.j-title{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:4px}
.j-body{font-size:13px;color:var(--text-secondary);line-height:1.55}

/* ════════════════════════════════════════════════════════════════════════════
   MODAL (small actions only)
   ════════════════════════════════════════════════════════════════════════════ */
.modal-backdrop{
  position:absolute;inset:0;
  background:rgba(30,58,95,.32);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:200;min-height:300px
}
.modal-backdrop.hidden{display:none}
.modal-sheet{
  background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  width:100%;max-width:520px;
  box-shadow:var(--shadow-lg);
  animation:slideUp .26s cubic-bezier(.34,1.4,.64,1)
}
@media(min-width:600px){.modal-sheet{border-radius:var(--r-xl);margin:auto;animation:popIn .24s cubic-bezier(.34,1.4,.64,1)}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes popIn{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 14px;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:600;color:var(--text-primary)}
.modal-x{width:28px;height:28px;border-radius:50%;
  background:var(--bg-mid);color:var(--text-muted);font-size:12px;
  display:flex;align-items:center;justify-content:center;transition:all .12s}

/* ══ TAB MANAGER ═══════════════════════════════════════════════════════════ */
let _tabs=[],_aid=null;

function _save(){
  sessionStorage.setItem('ws_tabs',JSON.stringify(_tabs));
  sessionStorage.setItem('ws_aid',_aid||'')
}
function _load(){
  try{
    _tabs=JSON.parse(sessionStorage.getItem('ws_tabs')||'[]');
    _aid=sessionStorage.getItem('ws_aid')||null;
    if(_aid&&!_tabs.find(x=>x.id===_aid))_aid=_tabs[0]?.id||null
  }catch{_tabs=[];_aid=null}
}
function _key(type,p={}){
  if(type==='home')return'home';
  if(type==='bot_center')return'bot_center';
  if(type==='daily_journal')return'daily_journal';
  return`${type}:${p.id||p.name||''}`
}

function openTab(type,p={}){
  const title=t('tab.'+type,{name:p.name||''});
  const key=_key(type,p);
  const ex=_tabs.find(x=>_key(x.type,x.p)===key);
  if(ex){_aid=ex.id;_save();renderAll();return ex.id}
  if(_tabs.length>=10){
    const old=_tabs.find(x=>x.type!=='home');
    if(old)_tabs.splice(_tabs.indexOf(old),1)
  }
  const id='t'+Date.now();
  _tabs.push({id,type,title,p,scroll:0});
  _aid=id;_save();renderAll();return id
}
function closeTab(id,ev){
  if(ev){ev.stopPropagation()}
  const i=_tabs.findIndex(x=>x.id===id);if(i<0)return;
  if(_aid===id){const n=_tabs[i+1]||_tabs[i-1]||null;_aid=n?.id||null}
  _tabs.splice(i,1);_save();renderAll()
}
function activateTab(id){
  if(!_tabs.find(x=>x.id===id))return;
  // save current scroll before switching
  const ws=document.getElementById('ws-workspace');
  const cur=_tabs.find(x=>x.id===_aid);
  if(cur)cur.scroll=ws?ws.scrollTop:0;
  _aid=id;_save();renderAll()
}
function getActiveTab(){return _tabs.find(x=>x.id===_aid)||null}

        <span class="inv-stat-value val-ok" style="font-size:13px">— (acquistato, no prep)</span>
      </div>
      <div class="inv-stat">
        <span class="inv-stat-label">${t('inv.deducted')}</span>
        <span class="inv-stat-value val-bad">23.1 kg · 312 uses</span>
      </div>
    </div>
    <div class="section">
      <p class="section-title">${t('inv.movements')}</p>
      <div class="movements-list">
        ${MOVS.map(m=>`
          <div class="movement-row">
            <span class="m-date">${m.d}</span>
            <span class="m-qty ${m.qc}">${m.q}</span>
            <div class="m-meta">
              <span class="m-source">${m.src}</span>
              <span class="m-note">${m.note}</span>
            </div>
          </div>`).join('')}
      </div>
    </div>
    <p class="demo-note"><span class="demo-dot"></span>${t('inv.note')}</p>
  </div>`
}

function renderJournal(){
  const cats=['service','maintenance','kitchen','staff','purchase'];
  const entryHTML=entries=>`
    <div class="j-entries" id="jlist">
      ${entries.map(e=>`
        <div class="j-entry sev-${e.sev}" data-cat="${e.cat}">
          <div class="j-meta">
            <span>${CAT_ICON[e.cat]||'📝'}</span>
            <span class="j-cat">${t('j.'+e.cat).toUpperCase()}</span>
            <span class="j-dot">·</span>
            <span class="j-time">${e.time}</span>
            <span class="j-dot">·</span>
            <span class="j-author">${e.auth}</span>
          </div>
          <h4 class="j-title">${e.title}</h4>
          ${e.body?`<p class="j-body">${e.body}</p>`:''}
        </div>`).join('')}
    </div>`;

  return`<div class="page-inner">
    <div class="page-header">
      <div class="page-header-row">
        <h2 class="page-title">${t('journal.title')}</h2>
        ${can('can_add_journal')?`<button class="btn-primary" onclick="openJModal()">+ ${t('journal.new')}</button>`:''}
      </div>
      <p class="page-subtitle">${t('journal.sub')}</p>
    </div>
    <div class="filter-row">
      <button class="chip active" onclick="filterJ('all',this)">${t('journal.all')}</button>
      ${cats.map(c=>`<button class="chip" onclick="filterJ('${c}',this)">${t('j.'+c)}</button>`).join('')}
    </div>
    ${entryHTML(JENTRIES)}
    <p class="demo-note"><span class="demo-dot"></span>${t('demo')}</p>
  </div>
  <!-- Modal: small action — correct usage -->
  <div class="modal-backdrop hidden" id="jmodal" onclick="if(event.target===this)closeJModal()">
    <div class="modal-sheet">
      <div class="modal-head">
        <span class="modal-title">${t('journal.new')}</span>
        <button class="modal-x" onclick="closeJModal()">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <label class="form-lbl">${t('j.form.title')}</label>
          <input class="form-in" id="jt" type="text" placeholder="Es. Lavastoviglie riparata">
        </div>
        <div>
          <label class="form-lbl">${t('j.form.cat')}</label>
          <select class="form-in" id="jc">
            ${cats.map(c=>`<option value="${c}">${t('j.'+c)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="form-lbl">${t('j.form.body')}</label>
          <textarea class="form-in form-ta" id="jb" rows="3" placeholder="Dettagli..."></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-secondary" onclick="closeJModal()">${t('j.form.cancel')}</button>
        <button class="btn-primary" onclick="saveJEntry()">${t('j.form.save')}</button>
      </div>
    </div>
  </div>`
}

function filterJ(f,btn){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.j-entry').forEach(e=>{
    e.style.display=(f==='all'||e.dataset.cat===f)?'':'none'
  })
}
function openJModal(){document.getElementById('jmodal')?.classList.remove('hidden')}
function closeJModal(){document.getElementById('jmodal')?.classList.add('hidden')}
function saveJEntry(){
  const title=document.getElementById('jt')?.value.trim();
  if(!title)return;
  const cat=document.getElementById('jc')?.value||'service';
  const body=document.getElementById('jb')?.value.trim()||'';
  const now=new Date();
  const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  JENTRIES.unshift({id:Date.now(),time,cat,auth:'Max (demo)',sev:'',title,body});
  closeJModal();
  // re-render journal content only
  const ws=document.getElementById('ws-workspace');
  const list=ws?.querySelector('#jlist');
  if(list){
    list.outerHTML=`<div class="j-entries" id="jlist">${JENTRIES.map(e=>`
      <div class="j-entry sev-${e.sev}" data-cat="${e.cat}">
        <div class="j-meta">
          <span>${CAT_ICON[e.cat]||'📝'}</span>
          <span class="j-cat">${t('j.'+e.cat).toUpperCase()}</span>
          <span class="j-dot">·</span>
          <span class="j-time">${e.time}</span>
          <span class="j-dot">·</span>
          <span class="j-author">${e.auth}</span>
        </div>
        <h4 class="j-title">${e.title}</h4>
        ${e.body?`<p class="j-body">${e.body}</p>`:''}
      </div>`).join('')}
    </div>`
  }
  document.getElementById('jt').value='';
  document.getElementById('jb').value='';
  showYCS(`"${title}" salvato nel diario.`);
}

function showYCS(msg){
  let el=document.getElementById('ycs');
  if(!el){
    el=document.createElement('div');el.id='ycs';
    el.innerHTML=`<div class="ycs-bg" onclick="hideYCS()"></div>
      <div class="ycs-card">
        <div class="ycs-icon">✅</div>
        <h2 class="ycs-title" id="ycs-title"></h2>
        <p class="ycs-msg" id="ycs-msg"></p>
        <button class="btn-primary ycs-btn" onclick="hideYCS()"></button>
      </div>`;
    document.getElementById('ws-workspace').appendChild(el)
  }
  el.querySelector('#ycs-title').textContent=t('ycs.title');
  el.querySelector('#ycs-msg').textContent=msg;
  el.querySelector('.ycs-btn').textContent=t('ycs.close');
  requestAnimationFrame(()=>el.classList.add('show'))
}
function hideYCS(){document.getElementById('ycs')?.classList.remove('show')}

/* ══ RENDERERS MAP ═════════════════════════════════════════════════════════ */
const PAGES={
  home:renderHome,
  bot_center:renderBots,
  recipe:renderRecipe,
  inventory:renderInventory,
  daily_journal:renderJournal
};
const TAB_ICONS={home:'⌂',bot_center:'🤖',recipe:'📋',inventory:'📦',daily_journal:'📓'};

/* ══ SHELL RENDERERS ═══════════════════════════════════════════════════════ */
function renderTopBar(){
  const lang=getLang();
  const role=getRole();
  const rn=ROLE_NAMES[role]||'Chef';
  const ri=ROLE_INITIALS[role]||'?';
  document.getElementById('ws-topbar').innerHTML=`
    <div class="topbar-brand">
      <div class="brand-mark">B</div>
      <div class="brand-text">
        <span class="brand-name">BOH OS</span>
        <span class="brand-sub">Workspace</span>
      </div>
    </div>
    <div class="topbar-search">
      <span class="search-icon">⌕</span>
      <span style="font-size:13px">${t('topbar.search')}</span>
    </div>
    <div class="topbar-right">
      <div class="lang-switcher">
        ${['it','en','es'].map(l=>`
          <button class="lang-btn${l===lang?' active':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>
        `).join('')}
      </div>
      <div class="role-wrapper">
        <div class="role-pill">
          <div class="role-avatar">${ri}</div>
          <span class="role-name">${rn}</span>
          <span style="font-size:11px;color:var(--text-muted);margin-left:2px">▾</span>
          <select class="role-select-hidden" onchange="setRole(this.value)">
            ${ROLES.map(r=>`<option value="${r}"${r===role?' selected':''}>${t('role.'+r)}</option>`).join('')}
          </select>
        </div>
      </div>
      <span class="demo-badge">DEMO</span>
    </div>`;
}

function renderTabBar(){
  const tabs=_tabs;const aid=_aid;
  document.getElementById('ws-tabbar').innerHTML=`
    <div class="tabbar-inner">
      ${tabs.map(tab=>`
        <div class="ws-tab${tab.id===aid?' active':''}"
             role="tab" aria-selected="${tab.id===aid}"
             onclick="activateTab('${tab.id}')">
          <span class="tab-icon">${TAB_ICONS[tab.type]||'📄'}</span>
          <span class="tab-title">${tab.title}</span>
          ${tab.type!=='home'?`
            <button class="tab-close"
              onclick="closeTab('${tab.id}',event)"
              title="Chiudi">✕</button>`:''}
        </div>`).join('')}
      <button class="tab-new" onclick="openTab('home',{})" title="${t('tab.new_page')}">+</button>
    </div>`;
  requestAnimationFrame(()=>{
    document.querySelector('.ws-tab.active')?.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'})
  })
}

function renderWorkspace(){
  const tab=getActiveTab();
  const ws=document.getElementById('ws-workspace');
  if(!tab){ws.innerHTML='';return}
  const fn=PAGES[tab.type];
  ws.innerHTML=fn?fn(tab.p||{}):`<div style="padding:40px;color:var(--text-muted)">Pagina non trovata: ${tab.type}</div>`;
  ws.scrollTop=tab.scroll||0;
  ws.onscroll=()=>{
    const cur=_tabs.find(x=>x.id===_aid);
    if(cur)cur.scroll=ws.scrollTop
  }
}

function renderAll(){
  renderTopBar();
  renderTabBar();
  renderWorkspace()
}

/* ══ INIT ══════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',()=>{
  _load();
  if(_tabs.length===0)openTab('home',{});
  else renderAll()
});
</script>
</body>
</html>
