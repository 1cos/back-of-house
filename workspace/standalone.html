<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BOH OS — Workspace</title>
<style>
:root{
  --bg:#eff6ff;--bg2:#dbeafe;--bg3:#e0f2fe;
  --surf:#fff;--surf-g:rgba(255,255,255,.75);--surf-r:rgba(255,255,255,.95);
  --tx:#1e3a5f;--tx2:#3b6ea8;--txm:#7a9cc4;--txi:#fff;
  --b9:#1e3a5f;--b7:#1d4ed8;--b6:#2563eb;--b5:#3b82f6;--b4:#60a5fa;
  --b2:#bfdbfe;--b1:#dbeafe;--b0:#eff6ff;
  --ok:#16a34a;--ok-bg:#f0fdf4;--ok-bd:#bbf7d0;
  --wn:#d97706;--wn-bg:#fffbeb;--wn-bd:#fde68a;
  --er:#dc2626;--er-bg:#fef2f2;--er-bd:#fecaca;
  --in:#2563eb;--in-bg:#eff6ff;--in-bd:#bfdbfe;
  --bd:rgba(37,99,235,.11);--bd2:rgba(37,99,235,.22);--bd-tab:rgba(37,99,235,.14);
  --sh0:0 1px 3px rgba(30,58,95,.06);
  --sh1:0 2px 8px rgba(30,58,95,.09);
  --sh2:0 6px 24px rgba(30,58,95,.12);
  --sh3:0 14px 48px rgba(30,58,95,.17);
  --shg:0 4px 24px rgba(30,58,95,.07),inset 0 1px 0 rgba(255,255,255,.8);
  --r1:8px;--r2:14px;--r3:20px;--rp:999px;
  --ff:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
  --fm:'SF Mono','Fira Code',monospace;
  --th:56px;--tbh:46px
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--ff);font-size:15px;color:var(--tx);
  background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit}

/* ── Shell ────────────────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background:linear-gradient(148deg,var(--bg) 0%,var(--bg2) 58%,var(--bg3) 100%)}

/* ── TOPBAR ───────────────────────────────────────────────────────────────── */
#topbar{
  flex-shrink:0;height:var(--th);
  display:flex;align-items:center;gap:12px;padding:0 20px;
  background:rgba(239,246,255,.82);
  backdrop-filter:blur(28px) saturate(1.9);
  -webkit-backdrop-filter:blur(28px) saturate(1.9);
  border-bottom:1px solid var(--bd);box-shadow:var(--sh1);z-index:100
}
.t-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.t-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--b6) 0%,var(--b4) 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff;
  box-shadow:0 2px 10px rgba(37,99,235,.38);flex-shrink:0
}
.t-words{display:flex;flex-direction:column;line-height:1.1}
.t-name{font-size:15px;font-weight:700;color:var(--b7);letter-spacing:-.03em}
.t-sub{font-size:10px;font-weight:600;color:var(--txm);letter-spacing:.1em;text-transform:uppercase}

.t-search{
  flex:1;max-width:340px;
  display:flex;align-items:center;gap:7px;
  background:var(--surf-r);border:1px solid var(--bd);border-radius:var(--rp);
  padding:7px 14px;color:var(--txm);font-size:13px;cursor:text;
  transition:border-color .15s,box-shadow .15s;margin:0 auto
}
.t-search:hover{border-color:var(--bd2);box-shadow:var(--sh0)}

.t-right{display:flex;align-items:center;gap:9px;flex-shrink:0;margin-left:auto}

/* Lang pills */
.lang-grp{
  display:flex;gap:1px;
  background:rgba(219,234,254,.6);border:1px solid var(--b2);
  border-radius:var(--rp);padding:3px
}
.lbtn{
  font-size:11px;font-weight:700;padding:4px 9px;
  border-radius:var(--rp);color:var(--txm);letter-spacing:.05em;
  transition:all .13s
}
.lbtn:hover{background:var(--b1);color:var(--b6)}
.lbtn.on{background:var(--b6);color:#fff;box-shadow:0 1px 5px rgba(37,99,235,.35)}

/* Role pill */
.role-wrap{position:relative;display:flex}
.role-pill{
  display:flex;align-items:center;gap:7px;
  background:var(--b0);border:1px solid var(--b2);border-radius:var(--rp);
  padding:5px 11px 5px 7px;cursor:pointer;transition:all .13s
}
.role-pill:hover{background:var(--b1);border-color:var(--b4)}
.role-av{
  width:24px;height:24px;border-radius:50%;
  background:var(--b6);color:#fff;
  font-size:10px;font-weight:800;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.role-nm{font-size:12px;font-weight:600;color:var(--b7)}
.role-arr{font-size:10px;color:var(--txm);margin-left:1px}
.role-sel{
  position:absolute;inset:0;opacity:0;width:100%;
  cursor:pointer;border:none;background:none
}

.demo-tag{
  font-size:9px;font-weight:800;letter-spacing:.1em;
  color:var(--wn);background:var(--wn-bg);
  border:1px solid var(--wn-bd);border-radius:var(--rp);
  padding:3px 9px;flex-shrink:0
}

/* ── TAB BAR ─────────────────────────────────────────────────────────────── */
#tabbar{
  flex-shrink:0;height:var(--tbh);
  background:rgba(235,244,255,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd);
  overflow:hidden;position:relative
}
/* fade right edge so + button has clean space */
#tabbar::after{
  content:'';position:absolute;right:44px;top:0;bottom:0;
  width:28px;background:linear-gradient(to right,transparent,rgba(235,244,255,.9));
  pointer-events:none;z-index:1
}
.tb-inner{
  display:flex;align-items:stretch;height:100%;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;padding:0 4px;gap:2px
}
.tb-inner::-webkit-scrollbar{display:none}

/* individual tab */
.tab{
  display:flex;align-items:center;gap:5px;
  padding:0 11px;min-width:90px;max-width:195px;
  height:100%;flex-shrink:0;
  color:var(--tx2);font-size:13px;
  cursor:pointer;user-select:none;
  border-bottom:2px solid transparent;
  border-radius:var(--r1) var(--r1) 0 0;
  transition:background .13s,color .13s,border-color .13s;
  position:relative
}
.tab:hover{background:rgba(255,255,255,.5);color:var(--tx)}

/* ACTIVE TAB — more glass, stronger signal */
.tab.on{
  background:rgba(255,255,255,.96);
  color:var(--b9);font-weight:600;
  border-bottom-color:var(--b6);
  box-shadow:
    0 -2px 12px rgba(37,99,235,.08),
    0 1px 0 0 rgba(255,255,255,.95),
    inset 0 1px 0 rgba(255,255,255,1);
  z-index:2
}
.tab-ico{font-size:14px;flex-shrink:0;opacity:.8}
.tab.on .tab-ico{opacity:1}
.tab-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tab-x{
  flex-shrink:0;width:18px;height:18px;
  border-radius:50%;font-size:10px;
  color:var(--txm);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:all .13s;margin-left:1px
}
.tab:hover .tab-x,.tab.on .tab-x{opacity:.65}
.tab-x:hover{opacity:1!important;background:var(--er-bg);color:var(--er)}
.tab-plus{
  flex-shrink:0;width:42px;height:100%;
  font-size:21px;font-weight:300;color:var(--txm);
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--r1);
  transition:all .13s;z-index:2;position:relative
}
.tab-plus:hover{color:var(--b6);background:rgba(255,255,255,.6)}

/* ── WORKSPACE ────────────────────────────────────────────────────────────── */
#workspace{
  flex:1;overflow-y:auto;
  padding:36px 28px 52px;
  scroll-behavior:smooth;position:relative
}
@media(max-width:640px){#workspace{padding:20px 14px 40px}}
.pi{width:100%;max-width:1100px;margin:0 auto}

/* ── Shared ───────────────────────────────────────────────────────────────── */
.ph{margin-bottom:28px}
.ph-row{display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:4px}
.ptitle{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.psub{font-size:13px;color:var(--tx2);margin-top:4px}

.sec{
  background:var(--surf-g);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--bd);border-radius:var(--r3);
  padding:22px 24px;margin-bottom:14px;box-shadow:var(--shg)
}
.sec-h{font-size:11px;font-weight:700;color:var(--txm);
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:16px}

.note{display:flex;align-items:center;gap:7px;
  font-size:11px;color:var(--txm);padding:6px 0}
.nd{width:5px;height:5px;border-radius:50%;background:var(--wn);flex-shrink:0}

/* Badge */
.bdg{display:inline-flex;align-items:center;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:var(--rp);white-space:nowrap}
.b-ok  {background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-wn  {background:var(--wn-bg);color:var(--wn);border:1px solid var(--wn-bd)}
.b-er  {background:var(--er-bg);color:var(--er);border:1px solid var(--er-bd)}
.b-in  {background:var(--in-bg);color:var(--in);border:1px solid var(--in-bd)}

/* Buttons */
.btnp{background:var(--b6);color:#fff;font-size:13px;font-weight:600;
  padding:9px 18px;border-radius:var(--r2);transition:all .12s;white-space:nowrap}
.btnp:hover{background:var(--b7);transform:translateY(-1px);box-shadow:var(--sh2)}
.btnp:active{transform:none;box-shadow:none}
.btns{background:var(--surf-r);color:var(--tx2);font-size:13px;font-weight:500;
  padding:9px 16px;border-radius:var(--r2);border:1px solid var(--bd);transition:all .12s}
.btns:hover{background:var(--b1);color:var(--b6)}

/* ════ HOME ═══════════════════════════════════════════════════════════════ */
.greet{margin-bottom:40px}
.greet-ey{font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--txm);margin-bottom:9px}
.greet-h{font-size:33px;font-weight:700;color:var(--b9);
  letter-spacing:-.04em;line-height:1.12}
.greet-s{font-size:15px;color:var(--tx2);margin-top:6px}

.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
@media(max-width:920px){.hgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.hgrid{grid-template-columns:1fr}}

.hcard{
  display:flex;flex-direction:column;
  background:var(--surf-g);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--bd);border-radius:var(--r3);
  text-align:left;cursor:pointer;overflow:hidden;
  box-shadow:var(--shg);
  transition:transform .22s cubic-bezier(.34,1.3,.64,1),
             box-shadow .22s,border-color .22s
}
.hcard:hover{transform:translateY(-3px);box-shadow:var(--sh3);border-color:var(--b4)}
.hcard:active{transform:translateY(0);box-shadow:var(--sh1)}

.hcard-top{padding:22px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between}
.hcard-ico{font-size:28px;width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  background:var(--b0);border:1px solid var(--b1);border-radius:var(--r2)}
.hcard-arr{font-size:17px;color:var(--txm);transition:transform .15s,color .15s}
.hcard:hover .hcard-arr{transform:translate(2px,-2px);color:var(--b5)}
.hcard-body{padding:0 22px 18px;flex:1}
.hcard-title{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:5px}
.hcard-desc{font-size:12px;color:var(--txm);line-height:1.58}
.hcard-foot{
  border-top:1px solid var(--bd);padding:9px 22px;
  font-size:11px;font-weight:500;color:var(--txm);
  display:flex;align-items:center;gap:6px;
  background:rgba(239,246,255,.38)
}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.s-ok{background:var(--ok)}.s-wn{background:var(--wn)}.s-in{background:var(--in)}

/* ════ BOTS ═══════════════════════════════════════════════════════════════ */
.pipelist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:var(--surf-r);
  border:1px solid var(--bd);border-radius:var(--r2)}
.pstep{width:26px;height:26px;border-radius:50%;
  background:var(--b1);color:var(--b7);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pbody{flex:1;min-width:0}
.pname{display:block;font-size:13px;font-weight:500;
  color:var(--tx);font-family:var(--fm);margin-bottom:1px}
.pmeta{font-size:11px;color:var(--txm)}

.obslist{display:flex;flex-direction:column;gap:8px}
.obs{display:flex;align-items:flex-start;gap:10px;
  padding:11px 14px;border-radius:var(--r2);
  border:1px solid var(--bd);background:var(--surf-r);
  font-size:13px;line-height:1.5}
.obs-wn{border-color:var(--wn-bd);background:var(--wn-bg)}
.obs-in{border-color:var(--in-bd);background:var(--in-bg)}

/* ════ RECIPE ════════════════════════════════════════════════════════════ */
.rlayout{display:grid;grid-template-columns:1fr 1.45fr;gap:16px}
@media(max-width:740px){.rlayout{grid-template-columns:1fr}}

.bom-hd{display:grid;grid-template-columns:1fr auto;gap:14px;
  padding:0 2px 9px;border-bottom:1px solid var(--bd);margin-bottom:2px;
  font-size:10px;font-weight:700;color:var(--txm);
  text-transform:uppercase;letter-spacing:.06em}
.brow{display:grid;grid-template-columns:1fr auto;gap:14px;
  padding:8px 2px;border-bottom:1px solid var(--bd);align-items:center}
.brow:last-child{border-bottom:none}
.bitem{font-size:13px;color:var(--tx)}
.bqty{font-size:12px;font-weight:600;font-family:var(--fm);color:var(--b6);white-space:nowrap}

.slist{display:flex;flex-direction:column;gap:12px}
.sitem{display:flex;align-items:flex-start;gap:12px;font-size:13px;line-height:1.58}
.snum{width:24px;height:24px;border-radius:50%;
  background:var(--b6);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* ════ INVENTORY ════════════════════════════════════════════════════════ */
.istats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:560px){.istats{grid-template-columns:1fr 1fr}}
.istat{background:var(--surf-g);backdrop-filter:blur(10px);
  border:1px solid var(--bd);border-radius:var(--r2);
  padding:16px 18px;box-shadow:var(--shg)}
.ilbl{font-size:10px;color:var(--txm);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:5px;display:block}
.ival{font-size:20px;font-weight:700;color:var(--tx)}
.v-ok{color:var(--ok)}.v-er{color:var(--er);font-size:13px!important}

.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:90px 62px 1fr;
  align-items:center;gap:12px;
  padding:10px 14px;background:var(--surf-r);
  border:1px solid var(--bd);border-radius:var(--r2);font-size:13px}
@media(max-width:480px){.mrow{grid-template-columns:70px 52px 1fr;gap:8px}}
.md{font-size:11px;color:var(--txm);font-family:var(--fm)}
.mq{font-weight:700;font-family:var(--fm)}
.qp{color:var(--ok)}.qn{color:var(--er)}
.mm{display:flex;flex-direction:column;gap:1px;min-width:0}
.ms{font-weight:500;font-size:13px;color:var(--tx)}
.mn{font-size:11px;color:var(--txm)}

/* ════ JOURNAL ══════════════════════════════════════════════════════════ */
.frow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-size:12px;font-weight:500;padding:5px 13px;
  border-radius:var(--rp);border:1px solid var(--bd);
  color:var(--tx2);background:var(--surf-r);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--b4);color:var(--b6)}
.chip.on{background:var(--b6);color:#fff;border-color:var(--b6)}

.jlist{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.jent{background:var(--surf-g);backdrop-filter:blur(10px);
  border:1px solid var(--bd);border-radius:var(--r2);
  padding:16px 20px;transition:box-shadow .13s}
.jent:hover{box-shadow:var(--sh2)}
.jent.sv-ok{border-left:3px solid var(--ok)}
.jent.sv-wn{border-left:3px solid var(--wn)}
.jmeta{display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.jcat{font-size:10px;font-weight:700;color:var(--tx2);letter-spacing:.06em}
.jdot{font-size:9px;color:var(--txm)}
.jtm{font-size:11px;color:var(--txm);font-family:var(--fm)}
.jau{font-size:11px;color:var(--txm)}
.jtit{font-size:15px;font-weight:600;color:var(--tx);margin-bottom:4px}
.jbod{font-size:13px;color:var(--tx2);line-height:1.55}

/* ════ MODAL ════════════════════════════════════════════════════════════ */
.mbk{
  position:absolute;inset:0;
  background:rgba(30,58,95,.3);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:200;min-height:240px
}
.mbk.hi{display:none}
@media(min-width:600px){.mbk{align-items:center;padding:24px}}
.msh{background:var(--surf);border-radius:var(--r3) var(--r3) 0 0;
  width:100%;max-width:520px;box-shadow:var(--sh3);
  animation:sUp .26s cubic-bezier(.34,1.45,.64,1)}
@media(min-width:600px){.msh{border-radius:var(--r3);animation:pIn .22s cubic-bezier(.34,1.45,.64,1)}}
@keyframes sUp{from{transform:translateY(56px);opacity:0}to{transform:none;opacity:1}}
@keyframes pIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.mhd{display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 14px;border-bottom:1px solid var(--bd)}
.mt{font-size:16px;font-weight:600}
.mx{width:28px;height:28px;border-radius:50%;
  background:var(--bg2);color:var(--txm);font-size:12px;
  display:flex;align-items:center;justify-content:center;transition:all .12s}
.mx:hover{background:var(--er-bg);color:var(--er)}
.mbody{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;
  padding:14px 22px 22px;border-top:1px solid var(--bd)}
.flbl{font-size:11px;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.fin{width:100%;background:var(--bg);border:1px solid var(--bd2);
  border-radius:var(--r1);padding:9px 12px;font-size:13px;color:var(--tx);
  outline:none;transition:border-color .13s,box-shadow .13s}
.fin:focus{border-color:var(--b5);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
.fta{resize:vertical;min-height:80px}

/* ════ YES CHEF ═════════════════════════════════════════════════════════ */
#ycs{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:300;pointer-events:none;opacity:0;transition:opacity .2s
}
#ycs.on{pointer-events:all;opacity:1}
.yb{position:absolute;inset:0;background:rgba(30,58,95,.42);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.yc{
  position:relative;background:var(--surf);border-radius:var(--r3);
  width:88%;max-width:360px;
  padding:46px 36px 50px;text-align:center;box-shadow:var(--sh3);
  transform:scale(.86) translateY(18px);
  transition:transform .3s cubic-bezier(.34,1.5,.64,1)
}
#ycs.on .yc{transform:scale(1) translateY(0)}
.yi{font-size:54px;margin-bottom:14px}
.yh{font-size:25px;font-weight:700;color:var(--tx);margin-bottom:10px}
.ym{font-size:14px;color:var(--tx2);margin-bottom:28px;line-height:1.55}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>

/* ══ TAB MANAGER ══════════════════════════════════════════════════════════ */
/*
  Singleton tabs (one per type): home, bot_center, daily_journal
  Entity tabs (keyed by id):     recipe:X, inventory:X
  Clicking a card that is already open → activates existing tab (no duplicate)
*/
let TABS=[], AID=null;

function _tabKey(type, params){
  if(type==='home')         return 'home';
  if(type==='bot_center')   return 'bot_center';
  if(type==='daily_journal') return 'daily_journal';
  /* entity types: keyed by id or name */
  return type + ':' + (params.id || params.name || '');
}

function openTab(type, params){
  params = params || {};
  const key = _tabKey(type, params);
  const existing = TABS.find(function(x){ return _tabKey(x.type,x.params)===key; });
  if(existing){
    /* save current scroll before switching */
    _saveScroll();
    AID = existing.id;
    _persist();
    renderAll();
    return existing.id;
  }
  /* evict oldest non-home if at limit */
  if(TABS.length >= 10){
    var old = TABS.find(function(x){ return x.type!=='home'; });
    if(old) TABS.splice(TABS.indexOf(old),1);
  }
  _saveScroll();
  var id = 't' + Date.now();
  var title = _tabTitle(type, params);
  TABS.push({id:id, type:type, title:title, params:params, scroll:0});
  AID = id;
  _persist();
  renderAll();
  return id;
}

function closeTab(id){
  var i = TABS.findIndex(function(x){ return x.id===id; });
  if(i<0) return;
  if(AID===id){
    var next = TABS[i+1] || TABS[i-1] || null;
    AID = next ? next.id : null;
  }
  TABS.splice(i,1);
  _persist();
  renderAll();
}

function activateTab(id){
  if(!TABS.find(function(x){ return x.id===id; })) return;
  _saveScroll();
  AID = id;
  _persist();
  renderAll();
}

function _saveScroll(){
  var cur = TABS.find(function(x){ return x.id===AID; });
  if(cur){
    var ws = document.getElementById('workspace');
    if(ws) cur.scroll = ws.scrollTop;
  }
}

function _tabTitle(type, p){
  if(type==='home')          return t('th');
  if(type==='bot_center')    return t('tb');
  if(type==='daily_journal') return t('tj');
  if(type==='recipe')        return t('tr',{n:p.name||''});
  if(type==='inventory')     return t('ti',{n:p.name||''});
  return type;
}

function _persist(){
  try{
    sessionStorage.setItem('ws_tabs', JSON.stringify(TABS));
    sessionStorage.setItem('ws_aid', AID||'');
  }catch(e){}
}

function _restoreTabs(){
  try{
    var raw = sessionStorage.getItem('ws_tabs');
    TABS = raw ? JSON.parse(raw) : [];
    AID  = sessionStorage.getItem('ws_aid') || null;
    if(AID && !TABS.find(function(x){ return x.id===AID; })){
      AID = TABS.length ? TABS[0].id : null;
    }
  }catch(e){ TABS=[]; AID=null; }
}

    +'<select class="fin" id="jcat">'+modalCats+'</select></div>'
    +'<div><label class="flbl">'+t('fb')+'</label>'
    +'<textarea class="fin fta" id="jb" rows="3" placeholder="Dettagli..."></textarea></div>'
    +'</div>'
    +'<div class="mfoot">'
    +'<button class="btns" onclick="closeJ()">'+t('fcancel')+'</button>'
    +'<button class="btnp" onclick="saveJ()">'+t('fsave')+'</button>'
    +'</div></div></div>';
}

function journalAfterRender(){
  var ws=document.getElementById('workspace');
  /* filter chips */
  ws.querySelectorAll('#jfilter .chip').forEach(function(chip){
    chip.addEventListener('click',function(){
      ws.querySelectorAll('#jfilter .chip').forEach(function(c){ c.classList.remove('on'); });
      chip.classList.add('on');
      var f=chip.dataset.f;
      ws.querySelectorAll('.jent').forEach(function(e){
        e.style.display=(f==='all'||e.dataset.cat===f)?'':'none';
      });
    });
  });
  /* new entry btn */
  var btn=ws.querySelector('#jnew-btn');
  if(btn) btn.addEventListener('click', openJ);
}

function openJ(){ document.getElementById('jmod')?.classList.remove('hi'); }
function closeJ(){ document.getElementById('jmod')?.classList.add('hi'); }
function saveJ(){
  var title=(document.getElementById('jt')?.value||'').trim();
  if(!title) return;
  var cat  = document.getElementById('jcat')?.value || 'service';
  var body = (document.getElementById('jb')?.value || '').trim();
  var now  = new Date();
  var time = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  JDATA.unshift({id:Date.now(),time:time,cat:cat,auth:'Max (demo)',sv:'',title:title,body:body});
  closeJ();
  /* re-render only the list without losing scroll */
  var listEl=document.getElementById('jlist');
  if(listEl){
    listEl.innerHTML=JDATA.map(function(e){
      return '<div class="jent sv-'+e.sv+'" data-cat="'+e.cat+'">'
        +'<div class="jmeta">'+(CAT_ICO[e.cat]||'📝')
        +' <span class="jcat">'+t('c'+e.cat.substring(0,5)).toUpperCase()+'</span>'
        +' <span class="jdot">·</span>'
        +' <span class="jtm">'+e.time+'</span>'
        +' <span class="jdot">·</span>'
        +' <span class="jau">'+e.auth+'</span></div>'
        +'<h4 class="jtit">'+e.title+'</h4>'
        +(e.body?'<p class="jbod">'+e.body+'</p>':'')
        +'</div>';
    }).join('');
  }
  document.getElementById('jt').value='';
  document.getElementById('jb').value='';
  showYCS('"'+title+'" salvato nel diario.');
}

/* YES CHEF */
function showYCS(msg){
  var ws=document.getElementById('workspace');
  var el=document.getElementById('ycs');
  if(!el){
    el=document.createElement('div'); el.id='ycs';
    el.innerHTML='<div class="yb" onclick="hideYCS()"></div>'
      +'<div class="yc">'
      +'<div class="yi">✅</div>'
      +'<h2 class="yh" id="yh"></h2>'
      +'<p class="ym" id="ym"></p>'
      +'<button class="btnp" style="margin:0 auto;display:block;min-width:180px;padding:13px" onclick="hideYCS()" id="yb"></button>'
      +'</div>';
    ws.appendChild(el);
  }
  document.getElementById('yh').textContent=t('yct');
  document.getElementById('ym').textContent=msg;
  document.getElementById('yb').textContent=t('ycclose');
  requestAnimationFrame(function(){ el.classList.add('on'); });
}
function hideYCS(){ var el=document.getElementById('ycs'); if(el) el.classList.remove('on'); }

/* ══ PAGE MAP ═════════════════════════════════════════════════════════════ */
var PAGES={
  home:         {render:pageHome,      after:homeAfterRender},
  bot_center:   {render:pageBots,      after:null},
  recipe:       {render:pageRecipe,    after:null},
  inventory:    {render:pageInventory, after:null},
  daily_journal:{render:pageJournal,   after:journalAfterRender}
};

/* ══ SHELL RENDERERS ══════════════════════════════════════════════════════ */
function renderTopBar(){
  var rn=RNAME[ROLE]||'Chef', ri=RINIT[ROLE]||'?';
  var langBtns=['it','en','es'].map(function(l){
    return '<button class="lbtn'+(l===LANG?' on':'')+'" data-l="'+l+'">'+l.toUpperCase()+'</button>';
  }).join('');
  var roleOpts=ROLES.map(function(r){
    return '<option value="'+r+'"'+(r===ROLE?' selected':'')+'>'+t('lbl_'+r.substring(0,2))+'</option>';
  }).join('');

  document.getElementById('topbar').innerHTML=
    '<div class="t-brand">'
    +'<div class="t-mark">B</div>'
    +'<div class="t-words"><span class="t-name">BOH OS</span><span class="t-sub">Workspace</span></div>'
    +'</div>'
    +'<div class="t-search"><span style="opacity:.6">⌕</span><span>'+t('search')+'</span></div>'
    +'<div class="t-right">'
    +'<div class="lang-grp" id="lang-grp">'+langBtns+'</div>'
    +'<div class="role-wrap">'
    +'<div class="role-pill">'
    +'<div class="role-av">'+ri+'</div>'
    +'<span class="role-nm">'+rn+'</span>'
    +'<span class="role-arr">▾</span>'
    +'<select class="role-sel" id="role-sel">'+roleOpts+'</select>'
    +'</div></div>'
    +'<span class="demo-tag">DEMO</span>'
    +'</div>';

  /* wire lang buttons via event delegation on the group */
  document.getElementById('lang-grp').addEventListener('click', function(e){
    var btn = e.target.closest('[data-l]');
    if(btn) setLang(btn.dataset.l);
  });
  document.getElementById('role-sel').addEventListener('change', function(e){
    setRole(e.target.value);
  });
}

function renderTabBar(){
  var inner = TABS.map(function(tab){
    var on = tab.id===AID;
    return '<div class="tab'+(on?' on':'')+'" data-tid="'+tab.id+'" role="tab" aria-selected="'+(on?'true':'false')+'">'
      +'<span class="tab-ico">'+(ICO[tab.type]||'📄')+'</span>'
      +'<span class="tab-lbl">'+tab.title+'</span>'
      +(tab.type!=='home'
        ? '<button class="tab-x" data-close="'+tab.id+'" title="Chiudi">✕</button>'
        : '')
      +'</div>';
  }).join('');
  inner += '<button class="tab-plus" id="tab-plus" title="'+t('tnew')+'">+</button>';

  var tbEl=document.getElementById('tabbar');
  tbEl.innerHTML='<div class="tb-inner" id="tb-inner">'+inner+'</div>';

  /* Wire via event delegation — avoids onclick= attribute encoding issues */
  document.getElementById('tb-inner').addEventListener('click', function(e){
    /* close button */
    var closeBtn=e.target.closest('[data-close]');
    if(closeBtn){ e.stopPropagation(); closeTab(closeBtn.dataset.close); return; }
    /* new tab */
    if(e.target.closest('#tab-plus')){ openTab('home',{}); return; }
    /* activate tab */
    var tabEl=e.target.closest('[data-tid]');
    if(tabEl) activateTab(tabEl.dataset.tid);
  });

  /* scroll active into view */
  requestAnimationFrame(function(){
    var el=document.querySelector('.tab.on');
    if(el) el.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});
  });
}

function renderWorkspace(){
  var tab=TABS.find(function(x){ return x.id===AID; });
  var ws=document.getElementById('workspace');
  if(!tab){ ws.innerHTML=''; return; }
  var page=PAGES[tab.type];
  ws.innerHTML = page ? page.render(tab.params||{}) : '<p style="padding:40px;color:var(--txm)">Pagina non trovata.</p>';
  /* restore scroll */
  ws.scrollTop = tab.scroll || 0;
  /* save scroll on scroll */
  ws.onscroll = function(){
    var cur=TABS.find(function(x){ return x.id===AID; });
    if(cur) cur.scroll=ws.scrollTop;
  };
  /* after-render hooks */
  if(page && page.after) page.after();
}

function renderAll(){
  renderTopBar();
  renderTabBar();
  renderWorkspace();
}

/* ══ INIT ═════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function(){
  LANG = sessionStorage.getItem('ws_lang') || 'it';
  ROLE = sessionStorage.getItem('ws_role') || 'executive';
  _restoreTabs();
  if(TABS.length===0) openTab('home', {});
  else renderAll();
});
</script>
